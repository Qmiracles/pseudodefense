[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pseudodefense"
version = "0.1.0.dev0"
description = "Reproducible pipeline to survey anti-phage defense systems in Pseudomonas genomes"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "pandas",
    "numpy",
    "scipy",
    "scikit-learn",
    "matplotlib",
    "seaborn",
    "biopython",
    "pyyaml",
    "pyrodigal>=3.7",
    "typer",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "pre-commit"]

[project.scripts]
pseudodefense = "pseudodefense.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "D"]
ignore = ["D100", "D104", "D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]
