# Configuracion de pseudodefense. Todo parametro del pipeline vive aqui.

outdir: results

# --- Seleccion de genomas (NCBI Datasets) ---
taxon: "Pseudomonas aeruginosa"
assembly_levels: [complete, chromosome]
assembly_source: RefSeq        # RefSeq (GCF_) o GenBank (GCA_)
exclude_atypical: true
n_genomes: 20                  # null = todos los genomas que cumplan los filtros
random_seed: 42                # semilla del muestreo de n_genomes

# --- QC de ensamblajes ---
# Umbrales provisionales; ver docs/REFERENCES.md (decisiones [POR VERIFICAR]).
qc:
  min_length: 5500000          # pb
  max_length: 7800000          # pb
  max_sequences: 20            # secuencias en el FASTA (cromosoma + plasmidos)
  min_gc: 65.0                 # %
  max_gc: 67.5                 # %
  min_checkm_completeness: 95.0  # % (se omite si NCBI no reporta CheckM)
  max_checkm_contamination: 5.0  # %

# --- Prediccion de genes (pyrodigal, modo single) ---
genes:
  translation_table: 11

# --- DefenseFinder ---
defensefinder:
  models_dir: resources/defensefinder_models  # descargados por la regla defensefinder_models
  # gembase: cada contig (cromosoma, plasmidos) es un replicon distinto; los IDs
  # <contig>_<n> de pyrodigal cumplen ese formato. Es lo que DefenseFinder 3.0.0
  # hace internamente cuando recibe un genoma en nucleotidos.
  db_type: gembase
  coverage: 0.4                # cobertura minima del perfil (default de DefenseFinder)
  workers: 2                   # hilos por genoma

# --- Analisis ---
analysis:
  level: type                  # type o subtype (clasificacion de DefenseFinder)
  # Solo se prueban sistemas con prevalencia en este rango: los presentes en
  # casi todos o casi ningun genoma no informan sobre co-ocurrencia.
  cooccurrence_min_prevalence: 0.05
  cooccurrence_max_prevalence: 0.95
  # Ademas, presente en >= N genomas y ausente en >= N genomas (con n pequeno,
  # el 5 % puede ser 1 genoma: pruebas sin poder que solo inflan BH).
  cooccurrence_min_genomes: 3
  fdr_alpha: 0.05              # Benjamini-Hochberg
  # Pares cuya distancia mediana (mismo replicon) es <= linkage_bp se marcan como
  # fisicamente ligados: co-ocurren por estar en el mismo locus.
  linkage_bp: 10000
  prevalence_top_n: 30         # barras en la figura de prevalencia
  cooccurrence_plot_max_systems: 40

threads: 4
